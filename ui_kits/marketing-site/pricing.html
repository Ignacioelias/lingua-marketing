<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pricing — Lingua</title>
  <link rel="icon" type="image/svg+xml" href="assets/lingua-mark.svg" />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* ===== Pricing page ===== */
    .lg-pricing { max-width: 1200px; margin: 0 auto; padding: 96px 24px 64px; }

    .lg-pricing__hero { text-align: center; margin-bottom: 48px; }
    .lg-pricing__eyebrow { font: var(--type-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--color-brand-blue); margin: 0 0 18px; }
    .lg-pricing__h {
      font: 600 64px/1.04 var(--font-sans);
      letter-spacing: var(--tracking-tight);
      color: var(--color-fg-ink);
      margin: 0 0 18px;
      text-wrap: balance;
    }
    .lg-pricing__h em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--color-brand-blue); }
    .lg-pricing__sub { font: var(--type-lead); color: var(--color-fg-ink-2); max-width: 56ch; margin: 0 auto 28px; }

    /* Billing toggle */
    .lg-pricing__toggle {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      background: var(--color-bg-cream-2);
      border: 1px solid var(--color-border);
      border-radius: 999px;
    }
    .lg-pricing__toggle-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 18px;
      border-radius: 999px;
      border: none;
      background: transparent;
      font: 500 14px/1 var(--font-sans);
      color: var(--color-fg-ink-2);
      cursor: pointer;
      transition: background .18s, color .18s;
    }
    .lg-pricing__toggle-btn.is-on {
      background: var(--color-fg-ink);
      color: #fff;
    }
    .lg-pricing__toggle-pill {
      display: inline-flex; align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--color-brand-blue);
      color: #fff;
      font: 600 11px/1 var(--font-sans);
      letter-spacing: .02em;
    }
    .lg-pricing__toggle-btn.is-on .lg-pricing__toggle-pill { background: rgba(255,255,255,.18); }

    /* Tier cards */
    .lg-pricing__tiers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 56px;
    }
    .lg-tier {
      position: relative;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 24px;
      padding: 36px 32px 32px;
      box-shadow: var(--shadow-card-cream);
      display: flex; flex-direction: column;
      transition: transform .2s, box-shadow .2s;
    }
    .lg-tier:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .lg-tier--pop {
      background: var(--color-bg-ink);
      color: #fff;
      border-color: var(--color-bg-ink);
    }
    .lg-tier__pop {
      position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
      background: var(--color-brand-blue);
      color: #fff;
      padding: 6px 14px;
      border-radius: 999px;
      font: 600 12px/1 var(--font-sans);
      letter-spacing: .02em;
    }
    .lg-tier__tag {
      font: 500 12px/1 var(--font-sans);
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--color-fg-muted);
      margin: 0 0 14px;
    }
    .lg-tier--pop .lg-tier__tag { color: rgba(255,255,255,.6); }
    .lg-tier__name {
      font: 500 18px/1.2 var(--font-sans);
      color: var(--color-fg-ink-2);
      margin: 0 0 18px;
    }
    .lg-tier--pop .lg-tier__name { color: rgba(255,255,255,.78); }
    .lg-tier__price { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 8px; margin: 0 0 10px; }
    .lg-tier__price-old {
      font: 500 22px/1 var(--font-sans);
      color: rgba(255,255,255,.42);
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
      letter-spacing: var(--tracking-tight);
    }
    .lg-tier:not(.lg-tier--pop) .lg-tier__price-old { color: var(--color-fg-muted); }
    .lg-tier__price-big {
      font: 600 56px/1 var(--font-sans);
      letter-spacing: var(--tracking-tight);
      color: var(--color-fg-ink);
    }
    .lg-tier--pop .lg-tier__price-big { color: #fff; }
    .lg-tier__beta {
      position: relative;
      display: flex; align-items: center; gap: 14px;
      align-self: stretch;
      padding: 12px 14px 12px 16px;
      margin: 4px 0 18px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(55,145,191,.22), rgba(55,145,191,.08));
      border: 1px solid rgba(55,145,191,.55);
      box-shadow: 0 0 0 3px rgba(55,145,191,.08), 0 6px 24px -8px rgba(55,145,191,.45);
      overflow: hidden;
    }
    .lg-tier__beta::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.18) 48%, transparent 60%);
      transform: translateX(-100%);
      animation: lg-tier-beta-shine 3.6s ease-in-out 1.2s infinite;
      pointer-events: none;
    }
    @keyframes lg-tier-beta-shine {
      0%, 100% { transform: translateX(-100%); }
      55%, 100% { transform: translateX(100%); }
    }
    .lg-tier__beta-stamp {
      flex: 0 0 auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-width: 54px; min-height: 54px;
      padding: 6px 4px;
      border-radius: 50%;
      background: var(--color-brand-blue);
      color: #fff;
      transform: rotate(-8deg);
      box-shadow: 0 4px 14px -2px rgba(55,145,191,.65), inset 0 0 0 2px rgba(255,255,255,.18);
      animation: lg-tier-beta-pulse 2.4s ease-in-out infinite;
    }
    @keyframes lg-tier-beta-pulse {
      0%, 100% { transform: rotate(-8deg) scale(1); }
      50%      { transform: rotate(-8deg) scale(1.05); }
    }
    .lg-tier__beta-stamp-pct {
      font: 700 18px/1 var(--font-sans);
      letter-spacing: -.02em;
    }
    .lg-tier__beta-stamp-lbl {
      font: 600 9px/1 var(--font-sans);
      letter-spacing: .12em;
      margin-top: 3px;
      opacity: .9;
    }
    .lg-tier__beta-copy {
      display: flex; flex-direction: column; gap: 3px;
      min-width: 0;
    }
    .lg-tier__beta-headline {
      font: 600 14px/1.25 var(--font-sans);
      color: #fff;
      letter-spacing: -.005em;
    }
    .lg-tier__beta-sub {
      font: 400 12px/1.35 var(--font-sans);
      color: rgba(255,255,255,.72);
    }
    .lg-tier__price-unit { font: 500 14px/1.2 var(--font-sans); color: var(--color-fg-ink-2); }
    .lg-tier--pop .lg-tier__price-unit { color: rgba(255,255,255,.7); }
    .lg-tier__price-sub {
      flex-basis: 100%;
      font: 400 13px/1.4 var(--font-sans);
      color: var(--color-fg-muted);
    }
    .lg-tier--pop .lg-tier__price-sub { color: rgba(255,255,255,.55); }
    .lg-tier__lede { font: 400 15px/1.5 var(--font-sans); color: var(--color-fg-ink-2); margin: 0 0 18px; min-height: 2em; }
    .lg-tier--pop .lg-tier__lede { color: rgba(255,255,255,.78); }
    .lg-tier__cta { width: 100%; justify-content: center; margin-bottom: 18px; }
    .lg-tier__note { font: 400 12px/1.4 var(--font-sans); color: var(--color-fg-muted); margin: -6px 0 18px; text-align: center; }
    .lg-tier__feats { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; padding-top: 18px; border-top: 1px solid var(--color-border); }
    .lg-tier--pop .lg-tier__feats { border-top-color: rgba(255,255,255,.14); }
    .lg-tier__feats li {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 10px;
      font: 400 14px/1.5 var(--font-sans);
      color: var(--color-fg-ink-2);
    }
    .lg-tier--pop .lg-tier__feats li { color: rgba(255,255,255,.85); }
    .lg-tier__check { color: var(--color-brand-blue); margin-top: 4px; }
    .lg-tier--pop .lg-tier__check { color: var(--color-brand-blue); }

    /* Student band */
    .lg-pricing__student {
      display: flex; align-items: center; justify-content: space-between; gap: 32px;
      background: linear-gradient(135deg, var(--color-bg-cream-2) 0%, color-mix(in oklch, var(--color-brand-blue) 6%, var(--color-bg-cream-2)) 100%);
      border: 1px solid var(--color-border);
      border-top: 3px solid var(--color-brand-blue);
      border-radius: 24px;
      padding: 32px 36px;
      margin-bottom: 96px;
      flex-wrap: wrap;
    }
    .lg-pricing__student-copy { flex: 1 1 480px; }
    .lg-pricing__student-eyebrow {
      font: 500 12px/1 var(--font-sans);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--color-brand-blue);
      margin: 0 0 10px;
    }
    .lg-pricing__student-h { font: 600 26px/1.2 var(--font-sans); margin: 0 0 8px; color: var(--color-fg-ink); letter-spacing: var(--tracking-tight); text-wrap: balance; }
    .lg-pricing__student-b { font: 400 15px/1.55 var(--font-sans); margin: 0 0 8px; color: var(--color-fg-ink-2); max-width: 64ch; }
    .lg-pricing__student-fine { font: 400 12.5px/1.5 var(--font-sans); margin: 0; color: var(--color-fg-muted); max-width: 64ch; }
    .lg-pricing__student-cta { white-space: nowrap; }

    /* Comparison table */
    .lg-ptable { margin-bottom: 96px; }
    .lg-ptable__h { font: var(--type-h2); letter-spacing: var(--tracking-tight); margin: 0 0 32px; text-align: center; }
    .lg-ptable__wrap { overflow-x: auto; }
    .lg-ptable__t {
      width: 100%;
      border-collapse: collapse;
      font: 400 14px/1.5 var(--font-sans);
      color: var(--color-fg-ink-2);
    }
    .lg-ptable__t thead th {
      font: 600 16px/1 var(--font-sans);
      color: var(--color-fg-ink);
      padding: 16px 12px;
      text-align: center;
      border-bottom: 1px solid var(--color-border);
    }
    .lg-ptable__t thead th:first-child { text-align: left; }
    .lg-ptable__t .lg-ptable__pop-col {
      background: color-mix(in oklch, var(--color-brand-blue) 8%, transparent);
    }
    .lg-ptable__t tbody th {
      font-weight: 500;
      color: var(--color-fg-ink);
      padding: 14px 12px;
      text-align: left;
      vertical-align: top;
    }
    .lg-ptable__t tbody td {
      padding: 14px 12px;
      text-align: center;
      vertical-align: top;
      border-bottom: 1px solid color-mix(in oklch, var(--color-border) 60%, transparent);
    }
    .lg-ptable__t tbody th { border-bottom: 1px solid color-mix(in oklch, var(--color-border) 60%, transparent); }
    .lg-ptable__sec th {
      font: 600 12px/1 var(--font-sans) !important;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--color-fg-muted) !important;
      padding: 28px 12px 10px !important;
      background: var(--color-bg-cream-2);
      border-bottom: 1px solid var(--color-border) !important;
    }
    .lg-ptable__yes { display: inline-flex; color: var(--color-brand-blue); }
    .lg-ptable__no { color: var(--color-fg-muted); }
    .lg-ptable__val { font: 500 13px/1.4 var(--font-sans); color: var(--color-fg-ink); }

    /* Calculator */
    .lg-calc {
      background: var(--color-bg-ink);
      color: #fff;
      border-radius: 32px;
      padding: 56px 48px;
      margin-bottom: 96px;
    }
    .lg-calc__h { font: 600 36px/1.1 var(--font-sans); letter-spacing: var(--tracking-tight); margin: 0 0 36px; text-align: center; }
    .lg-calc__grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; align-items: center; }
    .lg-calc__inputs { display: flex; flex-direction: column; gap: 32px; }
    .lg-calc__field { display: flex; flex-direction: column; gap: 12px; }
    .lg-calc__lbl { font: 500 16px/1.4 var(--font-sans); color: rgba(255,255,255,.85); }
    .lg-calc__lbl strong { color: var(--color-brand-blue); font-weight: 700; font-size: 1.4em; }
    .lg-calc__range { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 999px; background: rgba(255,255,255,.18); outline: none; }
    .lg-calc__range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--color-brand-blue); border: 3px solid #fff; cursor: pointer; }
    .lg-calc__range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--color-brand-blue); border: 3px solid #fff; cursor: pointer; }
    .lg-calc__note { font: 400 13px/1.5 var(--font-sans); color: rgba(255,255,255,.55); margin: 0; }
    .lg-calc__rate {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px;
      padding: 8px 14px;
      font: 500 18px/1 var(--font-sans);
      width: fit-content;
    }
    .lg-calc__rate input {
      width: 80px;
      background: transparent;
      border: none;
      color: #fff;
      font: 600 22px/1 var(--font-sans);
      outline: none;
      -moz-appearance: textfield;
    }
    .lg-calc__rate input::-webkit-outer-spin-button,
    .lg-calc__rate input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .lg-calc__rate-unit { color: rgba(255,255,255,.6); font-size: 14px; }

    .lg-calc__result {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 24px;
      padding: 32px;
      text-align: center;
    }
    .lg-calc__savings-lbl { font: 500 14px/1 var(--font-sans); color: rgba(255,255,255,.6); margin: 0 0 8px; letter-spacing: .02em; }
    .lg-calc__savings-big {
      font: 600 64px/1 var(--font-sans);
      letter-spacing: var(--tracking-tight);
      color: var(--color-brand-blue);
      margin: 0 0 24px;
    }
    .lg-calc__savings-big span { font-size: 22px; color: rgba(255,255,255,.6); font-weight: 500; margin-left: 4px; }
    .lg-calc__break { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; margin: 0; text-align: left; }
    .lg-calc__break div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
    .lg-calc__break dt { font: 400 13px/1.4 var(--font-sans); color: rgba(255,255,255,.6); margin: 0; }
    .lg-calc__break dd { font: 600 14px/1.4 var(--font-sans); color: #fff; margin: 0; }

    /* FAQ */
    .lg-pfaq { max-width: 760px; margin: 0 auto; }
    .lg-pfaq__h { font: var(--type-h2); letter-spacing: var(--tracking-tight); margin: 0 0 32px; text-align: center; }
    .lg-pfaq__list { display: flex; flex-direction: column; gap: 8px; }
    .lg-pfaq details {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 0;
      transition: border-color .18s, box-shadow .18s;
    }
    .lg-pfaq details[open] { border-color: var(--color-brand-blue); box-shadow: 0 8px 24px rgba(55,145,191,.10); }
    .lg-pfaq summary {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 22px 26px;
      cursor: pointer;
      font: 500 17px/1.4 var(--font-sans);
      color: var(--color-fg-ink);
      list-style: none;
    }
    .lg-pfaq summary::-webkit-details-marker { display: none; }
    .lg-pfaq__plus {
      flex-shrink: 0;
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--color-bg-cream-2);
      color: var(--color-fg-ink);
      display: flex; align-items: center; justify-content: center;
      font: 500 18px/1 var(--font-sans);
    }
    .lg-pfaq details[open] .lg-pfaq__plus { background: var(--color-brand-blue); color: #fff; }
    .lg-pfaq details p {
      margin: 0;
      padding: 0 26px 22px;
      font: 400 15px/1.6 var(--font-sans);
      color: var(--color-fg-ink-2);
      text-wrap: pretty;
    }

    @media (max-width: 1000px) {
      .lg-pricing__h { font-size: 48px; }
      .lg-pricing__tiers { grid-template-columns: 1fr; }
      .lg-calc { padding: 40px 28px; }
      .lg-calc__grid { grid-template-columns: 1fr; gap: 32px; }
      .lg-calc__savings-big { font-size: 48px; }
      .lg-calc__break { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .lg-pricing { padding: 64px 18px 48px; }
      .lg-pricing__h { font-size: 40px; }
      .lg-pricing__student { flex-direction: column; align-items: stretch; text-align: left; padding: 28px 24px; }
      .lg-pricing__student-cta { width: 100%; justify-content: center; }
      .lg-tier { padding: 28px 22px; }
      .lg-tier__price-big { font-size: 48px; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="dict.js?v=1777600000000"></script>
  <script src="i18n.js?v=1777600000000"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="LangToggle.jsx"></script>
  <script type="text/babel" src="Nav.jsx?v=1777599000000"></script>
  <script type="text/babel" src="CTABand.jsx"></script>
  <script type="text/babel" src="ContactModal.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <React.Fragment>
          <Nav />
          <main>
            <PricingPage />
            <CTABand />
          </main>
          <Footer />
        </React.Fragment>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

</html>
