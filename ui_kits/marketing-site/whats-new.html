<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Novedades — Lingua</title>
  <link rel="icon" type="image/svg+xml" href="assets/lingua-mark.svg" />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* ===== What's-new-page-only styles ===== */
    .lg-new { max-width: 1100px; margin: 0 auto; padding: 96px 24px 64px; }

    .lg-new__eyebrow {
      font: var(--type-eyebrow);
      letter-spacing: var(--letter-eyebrow);
      text-transform: uppercase;
      color: var(--color-brand-blue);
      margin: 0 0 24px;
      display: inline-flex; align-items: center; gap: 10px;
    }
    .lg-new__eyebrow::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--color-brand-blue);
      box-shadow: 0 0 0 4px rgba(55,145,191,0.18);
    }

    .lg-new__lede {
      font: 600 64px/1.04 var(--font-sans);
      letter-spacing: var(--tracking-tight);
      color: var(--color-fg-ink);
      margin: 0 0 28px;
      max-width: 18ch;
      text-wrap: balance;
    }
    .lg-new__lede em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--color-brand-blue); }

    .lg-new__intro {
      font: 400 22px/1.5 var(--font-sans);
      color: var(--color-fg-ink-2);
      max-width: 56ch;
      margin: 0;
      text-wrap: pretty;
    }

    /* Section scaffolding for each new feature */
    .lg-new__feat {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 96px;
    }

    .lg-new__feat-head {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 32px;
      align-items: end;
      margin-bottom: 36px;
    }

    .lg-new__feat-num {
      font: 500 13px/1 var(--font-mono);
      letter-spacing: 0.04em;
      color: var(--color-fg-muted);
      text-transform: uppercase;
    }
    .lg-new__feat-num span { color: var(--color-brand-blue); margin-right: 8px; }

    .lg-new__feat-h {
      font: 600 44px/1.06 var(--font-sans);
      letter-spacing: var(--tracking-tight);
      color: var(--color-fg-ink);
      margin: 18px 0 0;
      max-width: 18ch;
      text-wrap: balance;
    }
    .lg-new__feat-h em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--color-brand-blue); }

    .lg-new__feat-b {
      font: var(--type-lead);
      color: var(--color-fg-ink-2);
      max-width: 50ch;
      margin: 0;
      text-wrap: pretty;
    }

    /* Example demo cards: a "you said" → "Lingua wrote" pair, like the
       app-aware tone block on the marketing home but cleaner / bigger. */
    .lg-new__demos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .lg-new__demo {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 22px;
      box-shadow: var(--shadow-card-cream);
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .lg-new__demo-head {
      padding: 14px 20px;
      font: 500 12px/1 var(--font-sans);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-fg-muted);
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid #f0eadf;
    }
    .lg-new__demo-flag {
      display: inline-flex; align-items: center; gap: 6px;
      font: 500 12px/1 var(--font-sans);
      color: var(--color-fg-ink);
      text-transform: none;
      letter-spacing: 0;
      margin-left: auto;
    }
    .lg-new__demo-flag-dot {
      width: 16px; height: 12px;
      border-radius: 2px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
    }
    .lg-new__demo-said {
      padding: 18px 20px 8px;
      font: 500 18px/1.45 var(--font-sans);
      font-style: italic;
      letter-spacing: -0.011em;
      color: var(--color-fg-ink);
    }
    .lg-new__demo-arrow {
      font: 500 11px/1 var(--font-mono);
      color: var(--color-brand-blue);
      letter-spacing: 0.06em;
      padding: 8px 20px 6px;
      text-transform: uppercase;
    }
    .lg-new__demo-out {
      padding: 8px 20px 22px;
      font: 400 16px/1.5 var(--font-sans);
      color: var(--color-fg-ink);
      letter-spacing: -0.005em;
    }
    .lg-new__demo-out strong { font-weight: 500; color: var(--color-fg-ink); }

    /* Tone-adaptation app rows — adopting the .lg-tone visual from the home page */
    .lg-new__tone {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 22px;
      box-shadow: var(--shadow-card-cream);
      overflow: hidden;
    }
    .lg-new__tone-head {
      padding: 14px 22px;
      font: 500 13px var(--font-sans);
      color: #5b6675;
      border-bottom: 1px solid #f0eadf;
    }
    .lg-new__tone-said {
      color: var(--color-fg-ink);
      font-weight: 500;
      font-style: italic;
      letter-spacing: -0.011em;
      margin-left: 4px;
    }
    .lg-new__tone-row {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 18px;
      padding: 18px 22px;
      align-items: flex-start;
      border-top: 1px solid #f5efe3;
    }
    .lg-new__tone-row:first-of-type { border-top: none; }
    .lg-new__tone-app {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font: 500 14px var(--font-sans);
      color: var(--color-fg-ink);
      letter-spacing: -0.005em;
    }
    .lg-new__tone-badge {
      width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      font: 600 11px var(--font-sans); color: #fff;
      overflow: hidden;
    }
    .lg-new__tone-badge img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .lg-new__tone-badge--logo { background: #fff !important; padding: 0; }
    .lg-new__tone-out {
      font: 400 15px/1.5 var(--font-sans);
      color: var(--color-fg-ink);
      letter-spacing: -0.008em;
    }
    .lg-new__tone-pill {
      display: inline-block;
      font: 500 10px/1 var(--font-sans);
      color: #266d92;
      background: #d6e8f2;
      padding: 4px 8px;
      border-radius: 999px;
      letter-spacing: 0.02em;
      margin-left: 6px;
      vertical-align: 2px;
      text-transform: uppercase;
    }

    /* Closing band */
    .lg-new__close {
      max-width: 1100px; margin: 0 auto;
      padding: 0 24px 96px;
      text-align: center;
    }
    .lg-new__close-h { font: var(--type-h2); letter-spacing: var(--tracking-tight); margin: 0 0 16px; }
    .lg-new__close-h em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--color-brand-blue); }
    .lg-new__close-b { font: var(--type-lead); color: var(--color-fg-ink-2); max-width: 56ch; margin: 0 auto 28px; }

    @media (max-width: 820px) {
      .lg-new__lede { font-size: 44px; }
      .lg-new__feat-head { grid-template-columns: 1fr; gap: 14px; }
      .lg-new__feat-h { font-size: 32px; }
      .lg-new__demos { grid-template-columns: 1fr; }
      .lg-new__tone-row { grid-template-columns: 1fr; gap: 6px; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="dict.js?v=1777843300000"></script>
  <script src="i18n.js?v=1777843300000"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="LangToggle.jsx"></script>
  <script type="text/babel" src="Nav.jsx?v=1777599000000"></script>
  <script type="text/babel" src="CTABand.jsx"></script>
  <script type="text/babel" src="ContactModal.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    function NewHero() {
      const [, , t] = window.i18n.useLang();
      return (
        <section className="lg-new">
          <p className="lg-new__eyebrow">{t('new.eyebrow')}</p>
          <h1 className="lg-new__lede">
            {t('new.lede.a')}<em>{t('new.lede.em')}</em>{t('new.lede.b')}
          </h1>
          <p className="lg-new__intro">{t('new.intro')}</p>
        </section>
      );
    }

    // Feature 1 — Language translation
    // Two side-by-side demos: dictate in Spanish → write in English; dictate
    // mixed-language → write the language you choose.
    function FeatureTranslation() {
      const [lang, , t] = window.i18n.useLang();
      const wroteEn = t('new.f1.wrote.en');
      const wroteEs = t('new.f1.wrote.es');
      const demos = [
        { lang: t('new.f1.lang.es'), flag: 'linear-gradient(to bottom, #c60b1e 0 33%, #ffc400 33% 67%, #c60b1e 67%)', said: t('new.f1.d1.said'), wrote: wroteEn, out: t('new.f1.d1.out') },
        { lang: t('new.f1.lang.fr'), flag: 'linear-gradient(to right, #002654 0 33%, #fff 33% 67%, #ce1126 67%)', said: t('new.f1.d2.said'), wrote: wroteEn, out: t('new.f1.d2.out') },
        { lang: t('new.f1.lang.mix'), flag: 'linear-gradient(to bottom, #c60b1e 0 33%, #ffc400 33% 67%, #c60b1e 67%)', said: t('new.f1.d3.said'), wrote: wroteEs, out: t('new.f1.d3.out') },
        { lang: t('new.f1.lang.de'), flag: 'linear-gradient(to bottom, #000 0 33%, #dd0000 33% 67%, #ffce00 67%)', said: t('new.f1.d4.said'), wrote: lang === 'es' ? wroteEs : wroteEn, out: t('new.f1.d4.out') },
      ];
      return (
        <section className="lg-new__feat">
          <header className="lg-new__feat-head">
            <div>
              <p className="lg-new__feat-num"><span>01</span>{t('new.f1.tag')}</p>
              <h2 className="lg-new__feat-h">{t('new.f1.h.a')}<em>{t('new.f1.h.em')}</em>{t('new.f1.h.b')}</h2>
            </div>
            <p className="lg-new__feat-b">{t('new.f1.b')}</p>
          </header>

          <div className="lg-new__demos">
            {demos.map((d, i) => (
              <article key={i} className="lg-new__demo">
                <div className="lg-new__demo-head">
                  {t('new.f1.youSaid')}
                  <span className="lg-new__demo-flag">
                    <span className="lg-new__demo-flag-dot" style={{background: d.flag}}></span>
                    {d.lang}
                  </span>
                </div>
                <p className="lg-new__demo-said">{d.said}</p>
                <p className="lg-new__demo-arrow">{d.wrote}</p>
                <p className="lg-new__demo-out">{d.out}</p>
              </article>
            ))}
          </div>
        </section>
      );
    }

    // Feature 2 — App-aware tone adaptation
    // One block, multiple rows: same spoken sentence, different output per app.
    function FeatureToneAdapt() {
      const [, , t] = window.i18n.useLang();
      return (
        <section className="lg-new__feat">
          <header className="lg-new__feat-head">
            <div>
              <p className="lg-new__feat-num"><span>02</span>{t('new.f1.tag')}</p>
              <h2 className="lg-new__feat-h">{t('new.f2.h.a')}<em>{t('new.f2.h.em')}</em>{t('new.f2.h.b')}</h2>
            </div>
            <p className="lg-new__feat-b">{t('new.f2.b')}</p>
          </header>

          <div className="lg-new__tone">
            <div className="lg-new__tone-head">
              {t('new.f2.youSaid')}
              <span className="lg-new__tone-said"> {t('new.f2.spoken')}</span>
            </div>

            <div className="lg-new__tone-row">
              <span className="lg-new__tone-app">
                <span className="lg-new__tone-badge" style={{background: '#4a154b'}}>S</span>
                Slack <span className="lg-new__tone-pill">{t('new.f2.tone.casual')}</span>
              </span>
              <p className="lg-new__tone-out">{t('new.f2.slack')}</p>
            </div>

            <div className="lg-new__tone-row">
              <span className="lg-new__tone-app">
                <span className="lg-new__tone-badge lg-new__tone-badge--logo">
                  <img src="../../assets/app-gmail.png" alt="" />
                </span>
                Gmail <span className="lg-new__tone-pill">{t('new.f2.tone.warm')}</span>
              </span>
              <p className="lg-new__tone-out">{t('new.f2.gmail')}</p>
            </div>

            <div className="lg-new__tone-row">
              <span className="lg-new__tone-app">
                <span className="lg-new__tone-badge" style={{background: '#000'}}>N</span>
                Notion <span className="lg-new__tone-pill">{t('new.f2.tone.structured')}</span>
              </span>
              <p className="lg-new__tone-out">
                <strong>{t('new.f2.notion.status')}</strong>{t('new.f2.notion.statusV')}<br />
                <strong>{t('new.f2.notion.cause')}</strong>{t('new.f2.notion.causeV')}<br />
                <strong>{t('new.f2.notion.need')}</strong>{t('new.f2.notion.needV')}
              </p>
            </div>

            <div className="lg-new__tone-row">
              <span className="lg-new__tone-app">
                <span className="lg-new__tone-badge" style={{background: '#0e1116'}}>›_</span>
                Terminal <span className="lg-new__tone-pill">{t('new.f2.tone.terse')}</span>
              </span>
              <p className="lg-new__tone-out" style={{fontFamily: 'var(--font-mono)', fontSize: '14px'}}>{t('new.f2.terminal')}</p>
            </div>

            <div className="lg-new__tone-row">
              <span className="lg-new__tone-app">
                <span className="lg-new__tone-badge" style={{background: '#0a66c2', fontSize: '9px'}}>in</span>
                LinkedIn <span className="lg-new__tone-pill">{t('new.f2.tone.polished')}</span>
              </span>
              <p className="lg-new__tone-out">{t('new.f2.linkedin')}</p>
            </div>
          </div>
        </section>
      );
    }

    function NewClose() {
      const [, , t] = window.i18n.useLang();
      return (
        <section className="lg-new__close">
          <h2 className="lg-new__close-h">{t('new.close.h.a')}<em>{t('new.close.h.em')}</em>{t('new.close.h.b')}</h2>
          <p className="lg-new__close-b">{t('new.close.b')}</p>
          <a className="lg-btn lg-btn--primary" href="index.html" style={{borderBottom:'none'}}>{t('new.close.cta')}</a>
        </section>
      );
    }

    function App() {
      return (
        <React.Fragment>
          <Nav />
          <main>
            <NewHero />
            <FeatureTranslation />
            <FeatureToneAdapt />
            <NewClose />
            <CTABand />
          </main>
          <Footer />
        </React.Fragment>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
