<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Casos de uso — Lingua</title>
  <link rel="icon" type="image/svg+xml" href="assets/lingua-mark.svg" />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* ===== Use-cases-page-only styles ===== */

    /* ---------- Hero ---------- */
    .uc-hero { max-width: 1100px; margin: 0 auto; padding: 96px 24px 56px; }
    .uc-hero__eb {
      font: var(--type-eyebrow);
      letter-spacing: var(--letter-eyebrow);
      text-transform: uppercase;
      color: var(--color-brand-blue);
      margin: 0 0 22px;
      display: inline-flex; align-items: center; gap: 10px;
    }
    .uc-hero__eb::before {
      content: ''; display: inline-block;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--color-brand-blue);
      box-shadow: 0 0 0 4px rgba(55,145,191,0.18);
    }
    .uc-hero__h {
      font: 600 64px/1.04 var(--font-sans);
      letter-spacing: var(--tracking-tight);
      color: var(--color-fg-ink);
      margin: 0 0 24px;
      max-width: 20ch;
      text-wrap: balance;
    }
    .uc-hero__h em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--color-brand-blue); }
    .uc-hero__sub {
      font: 400 22px/1.5 var(--font-sans);
      color: var(--color-fg-ink-2);
      max-width: 56ch;
      margin: 0 0 36px;
      text-wrap: pretty;
    }

    /* Anchor pill strip */
    .uc-jumps {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 6px;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      width: fit-content;
    }
    .uc-jumps a {
      padding: 10px 18px; border-radius: 999px;
      font: 500 14px var(--font-sans);
      color: var(--color-fg-ink-2);
      border: none;
      transition: all .18s;
    }
    .uc-jumps a:hover { background: var(--color-bg-cream-2); color: var(--color-fg-ink); }

    /* ---------- Section scaffolding ---------- */
    .uc-sec {
      max-width: 1180px; margin: 0 auto;
      padding: 96px 24px;
      scroll-margin-top: 88px; /* below sticky nav */
    }
    .uc-sec--alt { background: var(--color-bg-cream-2); max-width: none; }
    .uc-sec--alt > .uc-sec__inner { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
    .uc-sec__inner { display: contents; }

    .uc-sec__head {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 56px;
      align-items: end;
      margin-bottom: 56px;
    }
    .uc-sec__num {
      font: 500 13px/1 var(--font-mono);
      letter-spacing: 0.06em;
      color: var(--color-fg-muted);
      text-transform: uppercase;
      margin: 0 0 16px;
    }
    .uc-sec__num span { color: var(--color-brand-blue); margin-right: 10px; }
    .uc-sec__h {
      font: 600 52px/1.04 var(--font-sans);
      letter-spacing: var(--tracking-tight);
      color: var(--color-fg-ink);
      margin: 0;
      max-width: 14ch;
      text-wrap: balance;
    }
    .uc-sec__h em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--color-brand-blue); }
    .uc-sec__b {
      font: var(--type-lead);
      color: var(--color-fg-ink-2);
      max-width: 50ch;
      margin: 0;
      text-wrap: pretty;
    }
    .uc-sec__b + .uc-sec__b { margin-top: 14px; }

    /* Body grid: copy block on the left, animated demo on the right */
    .uc-sec__body {
      display: grid;
      grid-template-columns: 1.05fr 1.2fr;
      gap: 56px;
      align-items: start;
    }
    .uc-sec--reverse .uc-sec__body {
      grid-template-columns: 1.2fr 1.05fr;
    }
    .uc-sec--reverse .uc-sec__body > .uc-sec__copy {
      order: 2;
    }

    /* Examples list (left column) */
    .uc-list {
      list-style: none; margin: 24px 0 0; padding: 0;
      display: flex; flex-direction: column; gap: 22px;
    }
    .uc-list__item {
      padding: 18px 0;
      border-top: 1px solid var(--color-border);
    }
    .uc-list__item:first-child { border-top: 1px solid var(--color-border); }
    .uc-list__before {
      font: 500 12px/1 var(--font-sans);
      letter-spacing: 0.06em;
      color: var(--color-fg-muted);
      text-transform: uppercase;
      margin: 0 0 6px;
    }
    .uc-list__b {
      font: 400 17px/1.5 var(--font-sans);
      color: var(--color-fg-ink-2);
      margin: 0;
      text-wrap: pretty;
    }
    .uc-list__b s { color: var(--color-fg-muted); text-decoration: line-through; }
    .uc-list__b em {
      font-style: normal;
      font-weight: 500;
      color: var(--color-fg-ink);
      background: linear-gradient(to top, color-mix(in oklch, var(--color-brand-blue) 22%, transparent) 35%, transparent 35%);
    }

    /* Stat strip below the examples */
    .uc-stat {
      display: inline-flex; flex-direction: column;
      margin-top: 40px;
      padding: 18px 22px;
      background: #fff;
      border-radius: 18px;
      border: 1px solid var(--color-border);
    }
    .uc-stat__big {
      font: 600 40px/1 var(--font-sans);
      letter-spacing: var(--tracking-tight);
      color: var(--color-brand-blue-deep);
    }
    .uc-stat__lbl {
      font: 400 13px/1.4 var(--font-sans);
      color: var(--color-fg-ink-2);
      margin-top: 4px;
      max-width: 28ch;
    }

    /* ---------- Apps row ---------- */
    .uc-apps {
      display: flex; align-items: center; gap: 14px;
      margin-top: 28px;
      flex-wrap: wrap;
    }
    .uc-apps__lbl {
      font: 500 12px/1 var(--font-sans);
      letter-spacing: 0.06em;
      color: var(--color-fg-muted);
      text-transform: uppercase;
    }
    .uc-apps__pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px 6px 8px;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      font: 500 13px var(--font-sans);
      color: var(--color-fg-ink-2);
    }
    .uc-apps__pill img { width: 18px; height: 18px; border-radius: 4px; object-fit: cover; }

    /* ===== Demos (right column) ===== */
    .uc-demo {
      position: relative;
      border-radius: 24px;
      background: #fff;
      border: 1px solid var(--color-border);
      box-shadow: 0 12px 32px -16px rgba(14,17,22,0.18);
      overflow: hidden;
      min-height: 420px;
    }
    .uc-demo__chrome {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg-cream);
    }
    .uc-demo__dot { width: 10px; height: 10px; border-radius: 50%; background: #e2dccd; }
    .uc-demo__dot.is-r { background: #ed8779; }
    .uc-demo__dot.is-y { background: #f5c45e; }
    .uc-demo__dot.is-g { background: #93c79b; }
    .uc-demo__title {
      margin-left: 8px;
      font: 500 13px var(--font-sans);
      color: var(--color-fg-ink-2);
    }
    .uc-demo__body { padding: 22px 24px; }

    /* — Consultants: typewriter doc — */
    .uc-doc__h {
      font: 600 22px/1.2 var(--font-sans);
      letter-spacing: var(--tracking-tight);
      color: var(--color-fg-ink);
      margin: 0 0 4px;
    }
    .uc-doc__meta {
      font: 400 12px var(--font-sans);
      color: var(--color-fg-muted);
      margin: 0 0 18px;
    }
    .uc-doc__type {
      font: 400 15px/1.6 var(--font-sans);
      color: var(--color-fg-ink);
      margin: 0;
      min-height: 8em;
      white-space: pre-wrap;
      text-wrap: pretty;
    }
    .uc-doc__type::after {
      content: '';
      display: inline-block;
      width: 8px; height: 18px;
      vertical-align: -3px;
      margin-left: 1px;
      background: var(--color-brand-blue);
      animation: uc-caret 1s steps(2) infinite;
    }
    @keyframes uc-caret { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
    .uc-doc__live {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 14px;
      font: 500 12px var(--font-sans);
      color: var(--color-fg-muted);
    }
    .uc-doc__live::before {
      content: '';
      display: inline-block;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--color-brand-blue);
      box-shadow: 0 0 0 4px rgba(55,145,191,0.18);
      animation: uc-pulse 1.4s ease-out infinite;
    }
    @keyframes uc-pulse {
      0% { box-shadow: 0 0 0 0 rgba(55,145,191,0.55); }
      80%,100% { box-shadow: 0 0 0 8px rgba(55,145,191,0); }
    }

    /* — Creators: stacked phone DMs — */
    .uc-dms { display: flex; flex-direction: column; gap: 10px; }
    .uc-dm {
      display: flex; gap: 12px;
      padding: 12px 14px;
      background: var(--color-bg-cream);
      border-radius: 18px;
      opacity: 0;
      transform: translateY(8px);
      animation: uc-dm-in .55s ease-out forwards;
    }
    @keyframes uc-dm-in { to { opacity: 1; transform: none; } }
    .uc-dm__av {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font: 600 14px var(--font-sans); color: #fff;
    }
    .uc-dm__body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .uc-dm__who {
      font: 500 13px var(--font-sans);
      color: var(--color-fg-ink);
    }
    .uc-dm__who span {
      font-weight: 400;
      color: var(--color-fg-muted);
      margin-left: 6px;
    }
    .uc-dm__msg {
      font: 400 14px/1.45 var(--font-sans);
      color: var(--color-fg-ink-2);
      margin: 0;
      text-wrap: pretty;
    }
    .uc-dm__reply {
      align-self: flex-end;
      margin-top: 6px;
      padding: 8px 12px;
      background: var(--color-brand-blue);
      color: #fff;
      border-radius: 14px 14px 4px 14px;
      font: 400 13px/1.4 var(--font-sans);
      max-width: 24ch;
      opacity: 0;
      animation: uc-reply-in .5s 1s ease-out forwards;
    }
    @keyframes uc-reply-in { to { opacity: 1; } }

    /* — Developers: terminal — */
    .uc-term {
      background: #0e1116;
      color: #e6e6e6;
      border-radius: 0 0 23px 23px;
      padding: 22px 24px;
      font: 400 13.5px/1.7 var(--font-mono);
      min-height: 360px;
    }
    .uc-term__line { display: block; min-height: 1.7em; }
    .uc-term__line.is-prompt::before { content: '› '; color: #6a7480; }
    .uc-term__line.is-mic::before { content: '🎙  '; }
    .uc-term__cmt { color: #6a7480; }
    .uc-term__str { color: #93c79b; }
    .uc-term__kw  { color: #82a9d2; }
    .uc-term__fn  { color: #d2a25e; }
    .uc-term__caret::after {
      content: '';
      display: inline-block;
      width: 7px; height: 14px; vertical-align: -2px;
      margin-left: 2px;
      background: #93c79b;
      animation: uc-caret 1s steps(2) infinite;
    }

    /* — Sales: email queue — */
    .uc-mail { display: flex; flex-direction: column; gap: 10px; padding: 8px 0; }
    .uc-mail__row {
      display: grid;
      grid-template-columns: 22px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      background: var(--color-bg-cream);
      border-radius: 14px;
      opacity: 0;
      animation: uc-mail-in .5s ease-out forwards;
    }
    @keyframes uc-mail-in { to { opacity: 1; } }
    .uc-mail__check {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--color-brand-blue);
      color: #fff; font: 600 12px var(--font-sans);
      display: flex; align-items: center; justify-content: center;
    }
    .uc-mail__who {
      font: 500 14px var(--font-sans);
      color: var(--color-fg-ink);
    }
    .uc-mail__sub {
      font: 400 13px var(--font-sans);
      color: var(--color-fg-ink-2);
      margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 32ch;
    }
    .uc-mail__time {
      font: 500 12px var(--font-mono);
      color: var(--color-fg-muted);
    }
    .uc-mail__counter {
      display: flex; align-items: baseline; gap: 8px;
      margin: 22px 4px 4px;
    }
    .uc-mail__counter-n {
      font: 600 36px/1 var(--font-sans);
      color: var(--color-brand-blue-deep);
      letter-spacing: var(--tracking-tight);
    }
    .uc-mail__counter-l {
      font: 400 13px var(--font-sans);
      color: var(--color-fg-ink-2);
    }

    /* — Students: notebook — */
    .uc-note {
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 31px,
        #ece4d3 31px,
        #ece4d3 32px
      );
      padding: 8px 24px 24px;
      min-height: 360px;
      font: 500 16.5px/32px var(--font-serif);
      font-style: italic;
      color: var(--color-fg-ink);
    }
    .uc-note__line {
      display: flex; gap: 10px; align-items: baseline;
      opacity: 0;
      animation: uc-note-in .5s ease-out forwards;
    }
    @keyframes uc-note-in { to { opacity: 1; } }
    .uc-note__bullet {
      color: var(--color-brand-blue);
      font-family: var(--font-sans);
      font-style: normal;
      font-weight: 600;
    }
    .uc-note__hl {
      background: linear-gradient(to top,
        color-mix(in oklch, var(--color-brand-blue) 22%, transparent) 38%,
        transparent 38%);
      padding: 0 2px;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 900px) {
      .uc-hero__h { font-size: 44px; }
      .uc-sec__h { font-size: 36px; }
      .uc-sec__head { grid-template-columns: 1fr; gap: 14px; }
      .uc-sec__body { grid-template-columns: 1fr; gap: 32px; }
      .uc-sec--reverse .uc-sec__body > .uc-sec__copy { order: 0; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="dict.js?v=1777843300000"></script>
  <script src="i18n.js?v=1777843300000"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="LangToggle.jsx"></script>
  <script type="text/babel" src="Nav.jsx?v=1777599000000"></script>
  <script type="text/babel" src="CTABand.jsx"></script>
  <script type="text/babel" src="ContactModal.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel" src="use-cases.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <React.Fragment>
          <Nav />
          <main>
            <UCHero />
            <UCConsultants />
            <UCCreators />
            <UCDevelopers />
            <UCSales />
            <UCStudents />
            <CTABand />
          </main>
          <Footer />
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
