<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sobre nosotros — Lingua</title>
  <link rel="icon" type="image/svg+xml" href="assets/lingua-mark.svg" />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* ===== About-page-only styles ===== */
    .lg-about { max-width: 1100px; margin: 0 auto; padding: 96px 24px 64px; }

    .lg-about__eyebrow { font: var(--type-eyebrow); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--color-brand-blue); margin: 0 0 24px; }

    .lg-about__lede {
      font: 600 56px/1.06 var(--font-sans);
      letter-spacing: var(--tracking-tight);
      color: var(--color-fg-ink);
      margin: 0 0 32px;
      max-width: 22ch;
      text-wrap: balance;
    }
    .lg-about__lede em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--color-brand-blue); }

    .lg-about__intro {
      font: 400 22px/1.5 var(--font-sans);
      color: var(--color-fg-ink-2);
      max-width: 62ch;
      margin: 0 0 16px;
      text-wrap: pretty;
    }

    .lg-about__sig {
      display: inline-flex; align-items: center; gap: 10px;
      margin-top: 32px;
      font: 500 14px var(--font-sans);
      color: var(--color-fg-muted);
      border: none;
    }
    .lg-about__sig-mark { width: 22px; height: 22px; }

    /* Manifesto block — quoted, on cream-2 */
    .lg-about__manifesto {
      margin: 64px 0 0;
      padding: 56px 56px;
      background: var(--color-bg-cream-2);
      border-radius: 32px;
      position: relative;
    }
    .lg-about__manifesto::before {
      content: '“';
      position: absolute;
      top: 8px; left: 32px;
      font: 400 180px/1 var(--font-serif);
      color: var(--color-brand-blue);
      opacity: .35;
      pointer-events: none;
    }
    .lg-about__manifesto p {
      font: 500 26px/1.42 var(--font-sans);
      letter-spacing: var(--tracking-snug);
      color: var(--color-fg-ink);
      margin: 0 0 20px;
      max-width: 38ch;
      text-wrap: pretty;
    }
    .lg-about__manifesto p:last-child { margin-bottom: 0; }
    .lg-about__manifesto strong { font-weight: 600; color: var(--color-brand-blue-deep); }

    /* Values grid */
    .lg-about__values { padding: 96px 24px; max-width: 1100px; margin: 0 auto; }
    .lg-about__values-head { display: flex; align-items: end; justify-content: space-between; gap: 32px; margin-bottom: 48px; }
    .lg-about__values-h { font: var(--type-h2); letter-spacing: var(--tracking-tight); margin: 0; max-width: 18ch; }
    .lg-about__values-sub { font: var(--type-lead); color: var(--color-fg-ink-2); max-width: 38ch; margin: 0; text-align: right; }

    .lg-about__vgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .lg-about__v {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 24px;
      padding: 36px;
      box-shadow: var(--shadow-card-cream);
      display: flex; flex-direction: column;
      transition: all .2s;
    }
    .lg-about__v:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .lg-about__v--blue { background: var(--color-brand-blue); color: #fff; border-color: var(--color-brand-blue); }
    .lg-about__v--blue .lg-about__v-h { color: #fff; }
    .lg-about__v--blue .lg-about__v-b { color: rgba(255,255,255,0.88); }

    .lg-about__v-num {
      font: 500 13px/1 var(--font-mono);
      letter-spacing: 0.04em;
      color: var(--color-fg-muted);
      margin-bottom: 28px;
    }
    .lg-about__v--blue .lg-about__v-num { color: rgba(255,255,255,0.7); }

    .lg-about__v-h { font: 600 26px/1.18 var(--font-sans); letter-spacing: var(--tracking-snug); margin: 0 0 14px; color: var(--color-fg-ink); }
    .lg-about__v-h em { font-family: var(--font-serif); font-style: italic; font-weight: 400; }

    .lg-about__v-b { font: 400 17px/1.55 var(--font-sans); color: var(--color-fg-ink-2); margin: 0; text-wrap: pretty; }

    /* Closing band — small, on cream */
    .lg-about__close {
      max-width: 1100px; margin: 0 auto;
      padding: 0 24px 96px;
      text-align: center;
    }
    .lg-about__close-h { font: var(--type-h2); letter-spacing: var(--tracking-tight); margin: 0 0 16px; }
    .lg-about__close-h em { font-family: var(--font-serif); font-style: italic; font-weight: 400; color: var(--color-brand-blue); }
    .lg-about__close-b { font: var(--type-lead); color: var(--color-fg-ink-2); max-width: 56ch; margin: 0 auto 28px; }

    @media (max-width: 820px) {
      .lg-about__lede { font-size: 40px; }
      .lg-about__manifesto { padding: 40px 28px; }
      .lg-about__manifesto::before { font-size: 120px; left: 16px; }
      .lg-about__manifesto p { font-size: 21px; }
      .lg-about__values-head { flex-direction: column; align-items: start; }
      .lg-about__values-sub { text-align: left; }
      .lg-about__vgrid { grid-template-columns: 1fr; }
    }

    /* ===== Roles contact modal ===== */
    .lg-roles-modal {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(14, 17, 22, 0.55);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      animation: lg-modal-fade .18s ease-out both;
    }
    @keyframes lg-modal-fade { from { opacity: 0; } to { opacity: 1; } }
    .lg-roles-modal__card {
      position: relative;
      background: #fff;
      border-radius: 18px;
      width: min(520px, 100%);
      max-height: calc(100vh - 48px);
      overflow: auto;
      padding: 32px 32px 28px;
      box-shadow: 0 24px 80px rgba(14,17,22,.28);
      animation: lg-modal-rise .22s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes lg-modal-rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
    .lg-roles-modal__x {
      position: absolute; top: 14px; right: 14px;
      width: 32px; height: 32px; border-radius: 50%;
      border: none; background: transparent;
      font-size: 22px; line-height: 1; cursor: pointer;
      color: var(--color-fg-ink-2);
      display: flex; align-items: center; justify-content: center;
    }
    .lg-roles-modal__x:hover { background: rgba(14,17,22,.06); color: var(--color-fg-ink); }
    .lg-roles-modal__h { font: var(--type-h3); letter-spacing: var(--tracking-tight); margin: 0 0 8px; }
    .lg-roles-modal__sub { font: 400 14px/1.5 var(--font-sans); color: var(--color-fg-ink-2); margin: 0 0 22px; }
    .lg-roles-modal__sub strong { color: var(--color-fg-ink); font-weight: 500; }
    .lg-roles-modal__form { display: flex; flex-direction: column; gap: 14px; }
    .lg-roles-modal__field { display: flex; flex-direction: column; gap: 6px; }
    .lg-roles-modal__field span { font: 500 12px/1 var(--font-sans); color: var(--color-fg-ink-2); letter-spacing: .02em; text-transform: uppercase; }
    .lg-roles-modal__field input,
    .lg-roles-modal__field textarea {
      font: 400 15px/1.45 var(--font-sans);
      color: var(--color-fg-ink);
      background: var(--color-bg-cream-2, #f1ebe1);
      border: 1px solid rgba(14,17,22,.10);
      border-radius: 10px;
      padding: 11px 13px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      resize: vertical;
      font-family: inherit;
    }
    .lg-roles-modal__field input:focus,
    .lg-roles-modal__field textarea:focus {
      border-color: var(--color-brand-blue);
      box-shadow: 0 0 0 3px color-mix(in oklch, var(--color-brand-blue) 18%, transparent);
    }
    .lg-roles-modal__actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
    .lg-roles-modal__actions .lg-btn { border-bottom: none; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="dict.js?v=1777597000000"></script>
  <script src="i18n.js?v=1777597000000"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="LangToggle.jsx"></script>
  <script type="text/babel" src="Nav.jsx?v=1777599000000"></script>
  <script type="text/babel" src="CTABand.jsx"></script>
  <script type="text/babel" src="ContactModal.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    function AboutHero() {
      const [, , t] = window.i18n.useLang();
      return (
        <section className="lg-about">
          <p className="lg-about__eyebrow">{t('about.eyebrow')}</p>
          <h1 className="lg-about__lede">
            {t('about.lede.a')}<em>{t('about.lede.em')}</em>{t('about.lede.b')}
          </h1>
          <p className="lg-about__intro">{t('about.intro.1')}</p>
          <p className="lg-about__intro">{t('about.intro.2')}</p>
          <a className="lg-about__sig" href="mailto:hello@lingua.ai">
            <svg className="lg-about__sig-mark" viewBox="0 0 1024 1024" fill="#3791bf" aria-hidden="true">
              <rect x="92.16" y="588.8" width="163.84" height="307.2" rx="81.92" ry="81.92"/>
              <rect x="317.44" y="358.4" width="163.84" height="537.6" rx="81.92" ry="81.92"/>
              <rect x="542.72" y="128" width="163.84" height="768" rx="81.92" ry="81.92"/>
              <rect x="768" y="435.2" width="163.84" height="460.8" rx="81.92" ry="81.92"/>
            </svg>
            <span>{t('about.sig')}</span>
          </a>

          <div className="lg-about__manifesto">
            <p>{t('about.manifesto.1')}</p>
            <p>{t('about.manifesto.2.a')}<strong>{t('about.manifesto.2.strong')}</strong>{t('about.manifesto.2.b')}</p>
            <p>{t('about.manifesto.3')}</p>
          </div>
        </section>
      );
    }

    function Values() {
      const [, , t] = window.i18n.useLang();
      const values = [
        { n: '01', ha: t('about.v1.h.a'), em: t('about.v1.h.em'), hb: t('about.v1.h.b'), b: t('about.v1.b'), blue: true },
        { n: '02', ha: t('about.v2.h.a'), em: t('about.v2.h.em'), hb: t('about.v2.h.b'), b: t('about.v2.b') },
        { n: '03', ha: t('about.v3.h.a'), em: t('about.v3.h.em'), hb: t('about.v3.h.b'), b: t('about.v3.b') },
        { n: '04', ha: t('about.v4.h.a'), em: t('about.v4.h.em'), hb: t('about.v4.h.b'), b: t('about.v4.b') },
      ];
      return (
        <section className="lg-about__values">
          <header className="lg-about__values-head">
            <h2 className="lg-about__values-h">{t('about.values.h')}</h2>
            <p className="lg-about__values-sub">{t('about.values.sub')}</p>
          </header>
          <div className="lg-about__vgrid">
            {values.map(v => (
              <article key={v.n} className={'lg-about__v' + (v.blue ? ' lg-about__v--blue' : '')}>
                <div className="lg-about__v-num">{v.n}</div>
                <h3 className="lg-about__v-h">{v.ha}<em>{v.em}</em>{v.hb}</h3>
                <p className="lg-about__v-b">{v.b}</p>
              </article>
            ))}
          </div>
        </section>
      );
    }

    function Close() {
      const [, , t] = window.i18n.useLang();
      const [open, setOpen] = React.useState(false);
      return (
        <section className="lg-about__close">
          <h2 className="lg-about__close-h">{t('about.close.h.a')}<em>{t('about.close.h.em')}</em>{t('about.close.h.b')}</h2>
          <p className="lg-about__close-b">{t('about.close.b')}</p>
          <a
            className="lg-btn lg-btn--primary"
            href="#"
            style={{borderBottom:'none'}}
            onClick={(e)=>{ e.preventDefault(); setOpen(true); }}
          >{t('about.close.cta')}</a>
          {open && <ContactModal topic="roles" onClose={()=>setOpen(false)} />}
        </section>
      );
    }

    function App() {
      return (
        <React.Fragment>
          <Nav />
          <main>
            <AboutHero />
            <Values />
            <Close />
            <CTABand />
          </main>
          <Footer />
        </React.Fragment>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
